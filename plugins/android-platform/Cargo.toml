[package]
name = "tauri-plugin-android-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
links = "tauri-plugin-android-platform"
publish = false

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
journey-core = { path = "../../crates/journey-core" }
