[package]
name = "cestou"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "cestou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-android-platform = { path = "../plugins/android-platform" }

[features]
custom-protocol = ["tauri/custom-protocol"]
