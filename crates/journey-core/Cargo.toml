[package]
name = "journey-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "cookies"] }
cookie_store = { version = "0.22", features = ["serde_json"] }
scraper = "0.24"
zeroize = { version = "1", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "io-util"] }
